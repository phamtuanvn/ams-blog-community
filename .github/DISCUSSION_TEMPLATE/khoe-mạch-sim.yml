body:
  - type: markdown
    attributes:
      value: |
        Khoe mạch, kết quả sim, layout hay project bạn tự làm. Kèm hình và số đo để mọi người góp ý cụ thể. Nhớ [luật ở bài ghim](https://github.com/phamtuanvn/ams-blog-community/discussions/1): chỉ đăng thứ bạn tự dựng hoặc lấy từ nguồn công khai.
  - type: input
    id: mach
    attributes:
      label: Mạch / PDK / công cụ
      placeholder: "vd: bandgap, sky130, xschem + ngspice"
  - type: textarea
    id: chi-tiet
    attributes:
      label: Bạn đã làm gì
      description: Mục tiêu, kết quả chính (số đo, hình), chỗ muốn được góp ý.
    validations:
      required: true
