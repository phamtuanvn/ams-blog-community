body:
  - type: markdown
    attributes:
      value: |
        Đọc nhanh [luật ở bài ghim](https://github.com/phamtuanvn/ams-blog-community/discussions/1) trước khi đăng. Câu hỏi càng đủ ngữ cảnh (mạch gì, PDK nào, đã thử gì) thì càng dễ được trả lời đúng. Viết tiếng Việt hay tiếng Anh đều được.
  - type: input
    id: mach
    attributes:
      label: Mạch / PDK / công cụ
      placeholder: "vd: OTA 5 transistor, sky130, ngspice"
  - type: textarea
    id: da-thu
    attributes:
      label: Bạn đã thử gì?
      description: Đã tính tay, sim hay đọc ở đâu, kết quả ra sao.
  - type: textarea
    id: chi-tiet
    attributes:
      label: Câu hỏi chi tiết
      description: "Dán netlist vào khối ```spice ... ```, kéo thả hình vào ô này."
    validations:
      required: true
